name: Публикация дашборда

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходников
        uses: actions/checkout@v6

      - name: Подготовка Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-site/package-lock.json

      - name: Установка зависимостей
        run: npm ci
        working-directory: dashboard-site

      - name: Сборка сайта
        run: npm run build:pages
        working-directory: dashboard-site

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v5

      - name: Подготовка файлов публикации
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard-site/pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
